function decodeHTML(b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
const views={public:decodeHTML(PUBLIC_B64),owner:decodeHTML(OWNER_B64)};
const frame=document.getElementById('frame');let current='public';
function showMBGView(which){current=which==='owner'?'owner':'public';document.getElementById('publicBtn').classList.toggle('active',current==='public');document.getElementById('ownerBtn').classList.toggle('active',current==='owner');document.getElementById('help').style.display=current==='owner'?'block':'none';frame.srcdoc=views[current];}
document.getElementById('publicBtn').addEventListener('click',()=>showMBGView('public'));document.getElementById('ownerBtn').addEventListener('click',()=>showMBGView('owner'));window.showMBGView=showMBGView;showMBGView('public');
</script></body></html>
